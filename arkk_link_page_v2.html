main { width:min(100%, 460px); position:relative; }
.card {
  position:relative; overflow:hidden; text-align:center;
  padding:34px 30px 28px; border-radius:34px;
  background:var(--glass); border:1px solid rgba(255,255,255,.22);
  box-shadow:0 28px 90px rgba(0,0,0,.32);
  backdrop-filter:blur(17px); -webkit-backdrop-filter:blur(17px);
}
.card:before {
  content:""; position:absolute; width:230px; height:230px; border-radius:50%;
  background:rgba(246,184,177,.13); filter:blur(40px); top:-125px; left:calc(50% - 115px);
  pointer-events:none;
}
.avatar-wrap { position:relative; display:inline-block; margin:2px auto 12px; }
.avatar {
  display:block; width:118px; height:118px; object-fit:cover; border-radius:38% 38% 44% 44%;
  border:3px solid rgba(255,238,235,.92); transform:rotate(-3deg);
  box-shadow:0 12px 34px rgba(0,0,0,.34);
}
.spark { position:absolute; color:#ffd7d1; font-size:25px; }
.spark.one { right:-18px; top:0; } .spark.two { left:-18px; bottom:0; font-size:17px; }
h1 { position:relative; margin:8px 0 1px; font-size:36px; letter-spacing:3px; font-weight:850; }
.handle { margin:0; color:rgba(255,245,244,.75); font-size:14px; }
.bio { margin:18px 0 25px; color:#ffe1dc; font-size:12px; letter-spacing:2px; }
.links { display:grid; gap:12px; }
.link {
  min-height:60px; display:flex; align-items:center; gap:13px; text-align:left;
  padding:12px 18px; border-radius:19px; text-decoration:none; color:#fff8f6;
  background:rgba(255,255,255,.105); border:1px solid rgba(255,255,255,.22);
  transition:transform .2s ease, background .2s ease, border-color .2s ease;
}
.link:hover { transform:translateY(-3px) scale(1.01); background:rgba(255,220,215,.19); border-color:rgba(255,220,215,.55); }
.link.primary { color:#35252a; background:linear-gradient(110deg,#ffe0d9,#f2b4b2); border:0; }
.link.primary:hover { background:linear-gradient(110deg,#ffebe5,#f7c4bf); }
.symbol { width:36px; height:36px; display:grid; place-items:center; border-radius:12px; flex:none; background:rgba(255,255,255,.17); font-size:20px; }
.primary .symbol { background:rgba(255,255,255,.45); }
.link-copy { display:flex; flex-direction:column; gap:2px; }
.link-title { font-weight:800; font-size:15px; }
.link-sub { font-size:11px; opacity:.72; }
.arrow { margin-left:auto; font-size:20px; opacity:.7; }
footer { margin-top:19px; font-size:10px; letter-spacing:2.5px; color:rgba(255,255,255,.67); }
@media (min-width:760px) {
 body { padding:55px 30px; }
 main { width:440px; }
 .card { padding:40px 34px 30px; }
 .avatar { width:130px; height:130px; }
}
@media (max-width:520px) {
 body { padding:22px 16px; background-attachment:scroll; }
 main { width:100%; max-width:410px; }
 .card { padding:29px 21px 24px; border-radius:29px; }
 .avatar { width:108px; height:108px; }
 h1 { font-size:33px; }
 .link { min-height:58px; }
}
@media (prefers-reduced-motion: reduce) { .link { transition:none; } }
</style>
